    <!--
      Single self-contained Babel script.
      React hooks (useState etc.) are destructured from window.React at the top
      of the inlined JSX, so no ES module imports are needed.
    -->
    <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── STYLES ────────────────────────────────────────────────────────────────────
const STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c10;
    --bg2: #0d1318;
    --bg3: #111820;
    --surface: #151d27;
    --surface2: #1c2733;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --accent4: #f59e0b;
    --text: #e8edf2;
    --text2: #8fa3b3;
    --text3: #4a6070;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
    --radius: 12px;
    --radius2: 8px;
    --glow: 0 0 30px rgba(0,212,255,0.15);
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow-x: hidden; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  .app { min-height: 100vh; }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    /* hero bg: add your own image url here */
    background-size: cover;
    background-position: center;
    filter: brightness(0.18) saturate(0.6);
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(8,12,16,0.6) 0%, rgba(124,58,237,0.08) 50%, rgba(0,212,255,0.06) 100%);
  }
  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }
  .hero-content {
    position: relative; z-index: 2;
    text-align: center;
    padding: 40px 24px;
    max-width: 860px;
  }
  .hero-badge {
    display: inline-block;
    padding: 6px 16px;
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 100px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(0,212,255,0.06);
    margin-bottom: 28px;
    animation: fadeUp 0.6s ease both;
  }
  .hero-title {
    font-family: var(--display);
    font-size: clamp(52px, 9vw, 110px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 30%, rgba(0,212,255,0.8) 70%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .hero-sub {
    font-size: 18px;
    color: var(--text2);
    font-weight: 300;
    line-height: 1.7;
    max-width: 560px;
    margin: 24px auto 40px;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  .hero-stats {
    display: flex;
    gap: 40px;
    justify-content: center;
    animation: fadeUp 0.6s 0.3s ease both;
    flex-wrap: wrap;
  }
  .hero-stat { text-align: center; }
  .hero-stat-num {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 800;
    color: var(--accent);
  }
  .hero-stat-label { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .hero-cta {
    margin-top: 44px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.6s 0.4s ease both;
  }
  .btn-primary {
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(0,212,255,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.4); }
  .btn-secondary {
    padding: 14px 32px;
    background: transparent;
    color: var(--text);
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }

  /* MAIN SECTION */
  .main-section {
    background: var(--bg);
    padding: 0 0 80px;
  }
  .section-header {
    padding: 60px 32px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .section-title {
    font-family: var(--display);
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  /* CATEGORY TABS */
  .category-bar {
    padding: 0 32px 32px;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cat-tab {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 100px;
    background: transparent;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-tab:hover { border-color: var(--border2); color: var(--text); }
  .cat-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* GRAPH GRID */
  .graph-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    padding: 0 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* GRAPH CARD */
  .graph-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.25s;
    cursor: pointer;
  }
  .graph-card:hover {
    border-color: var(--border2);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    transform: translateY(-2px);
  }
  .graph-card.open {
    grid-column: 1 / -1;
    cursor: default;
    border-color: rgba(0,212,255,0.2);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-meta { display: flex; align-items: center; gap: 12px; }
  .card-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .card-title {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .card-level {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
    letter-spacing: 0.08em;
  }
  .card-expand {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .card-expand:hover { border-color: var(--accent); color: var(--accent); }
  .card-preview {
    height: 140px;
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* FULL GRAPH VIEW */
  .full-graph-view { padding: 0 20px 20px; }
  .ai-bar {
    margin: 20px 0 16px;
    display: flex;
    gap: 10px;
  }
  .ai-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .ai-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
  .ai-input::placeholder { color: var(--text3); }
  .ai-btn {
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    min-width: 80px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.3); }
  .ai-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .graph-workspace {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .graph-workspace { grid-template-columns: 1fr; }
    .graph-grid { grid-template-columns: 1fr; padding: 0 16px; }
    .category-bar { padding: 0 16px 24px; }
    .section-header { padding: 40px 16px 28px; }
  }

  .canvas-container {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
  }
  canvas { display: block; width: 100%; }

  /* CONTROLS */
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg3);
  }
  .control-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
  }
  .control-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.08em;
  }
  .control-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .control-slider {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
    cursor: pointer;
  }
  .control-num {
    width: 58px;
    padding: 5px 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .control-num:focus { border-color: var(--accent); }

  /* INFO PANEL */
  .info-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 600px;
    overflow-y: auto;
  }
  .info-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .info-section:last-child { border-bottom: none; }
  .info-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }
  .formula-box {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.02em;
  }
  .info-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.65;
  }
  .prop-list { display: flex; flex-direction: column; gap: 8px; }
  .prop-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .prop-key {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    flex-shrink: 0;
    padding-top: 1px;
  }
  .prop-val {
    font-size: 12px;
    color: var(--text);
    text-align: right;
    font-family: var(--mono);
  }

  /* AI RESPONSE */
  .ai-response {
    background: linear-gradient(135deg, rgba(0,212,255,0.05), rgba(124,58,237,0.05));
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    animation: fadeUp 0.3s ease;
  }
  .ai-response-title {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .ai-loading {
    display: flex; align-items: center; gap: 10px;
    color: var(--text3); font-size: 13px;
    padding: 12px 0;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* FOOTER */
  .footer {
    border-top: 1px solid var(--border);
    padding: 40px 32px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    background: var(--bg2);
  }
  .footer-title {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* NAV */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-link {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s;
    background: none; border: none;
  }
  .nav-link:hover { color: var(--text); }

  /* SEARCH */
  .search-bar {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px 24px;
  }
  .search-input {
    width: 100%;
    padding: 13px 20px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
  }
  .search-input::placeholder { color: var(--text3); }
`;

// ─── GRAPH DEFINITIONS ─────────────────────────────────────────────────────────
const GRAPH_DEFS = [
  {
    id: "linear", title: "Linear Function", category: "Algebra", level: "Grade 7-8",
    color: "#00d4ff", colorBg: "rgba(0,212,255,0.1)",
    formula: "y = mx + b",
    icon: "y=mx",
    desc: "A linear function creates a straight line. The slope m controls steepness, and b shifts the line up or down.",
    params: [
      { key: "m", label: "Slope (m)", min: -5, max: 5, step: 0.1, default: 1.5 },
      { key: "b", label: "Y-Intercept (b)", min: -10, max: 10, step: 0.5, default: 2 }
    ],
    props: (p) => [
      { k: "Slope", v: p.m?.toFixed(2) ?? "1.50" },
      { k: "Y-Intercept", v: `(0, ${p.b?.toFixed(1) ?? "2.0"})` },
      { k: "X-Intercept", v: p.m !== 0 ? `(${(-(p.b ?? 2) / (p.m ?? 1.5)).toFixed(2)}, 0)` : "None" },
      { k: "Domain", v: "All real numbers" },
      { k: "Range", v: "All real numbers" },
      { k: "Behavior", v: (p.m ?? 1.5) > 0 ? "Increasing" : (p.m ?? 1.5) < 0 ? "Decreasing" : "Constant" },
    ],
    defaultProblem: "A rideshare driver earns $2 base pay plus $1.50 per mile. How much does she earn after driving 8 miles? When does she earn $20?",
  },
  {
    id: "quadratic", title: "Quadratic Function", category: "Algebra", level: "Grade 8-9",
    color: "#7c3aed", colorBg: "rgba(124,58,237,0.1)",
    formula: "y = ax² + bx + c",
    icon: "x²",
    desc: "Quadratic functions form parabolas. The coefficient a controls width and direction, b shifts horizontally, and c shifts vertically.",
    params: [
      { key: "a", label: "a (width/dir)", min: -3, max: 3, step: 0.1, default: 1 },
      { key: "b", label: "b (shift)", min: -6, max: 6, step: 0.5, default: 0 },
      { key: "c", label: "c (vertical)", min: -8, max: 8, step: 0.5, default: -4 }
    ],
    props: (p) => {
      const a = p.a ?? 1, b = p.b ?? 0, c = p.c ?? -4;
      const vx = -b / (2 * a);
      const vy = a * vx * vx + b * vx + c;
      return [
        { k: "Vertex", v: `(${vx.toFixed(2)}, ${vy.toFixed(2)})` },
        { k: "Axis of Symmetry", v: `x = ${vx.toFixed(2)}` },
        { k: "Y-Intercept", v: `(0, ${c.toFixed(1)})` },
        { k: "Opens", v: a > 0 ? "Upward" : "Downward" },
        { k: "Domain", v: "All real numbers" },
        { k: "Range", v: a > 0 ? `[${vy.toFixed(2)}, +∞)` : `(-∞, ${vy.toFixed(2)}]` },
      ];
    },
    defaultProblem: "A ball is thrown upward from a 4-foot platform. Its height is h = -t² + 6t + 4. When does it reach max height and when does it land?",
  },
  {
    id: "cubic", title: "Cubic Function", category: "Algebra", level: "Grade 9-10",
    color: "#10b981", colorBg: "rgba(16,185,129,0.1)",
    formula: "y = ax³ + bx² + cx + d",
    icon: "x³",
    desc: "Cubic functions can have one or two turning points, creating S-shaped or wavy curves useful for modeling complex real-world scenarios.",
    params: [
      { key: "a", label: "a", min: -2, max: 2, step: 0.1, default: 1 },
      { key: "b", label: "b", min: -4, max: 4, step: 0.5, default: 0 },
      { key: "c", label: "c", min: -6, max: 6, step: 0.5, default: -3 },
      { key: "d", label: "d", min: -8, max: 8, step: 0.5, default: 0 }

// ─── GRAPH DRAWING ENGINE ──────────────────────────────────────────────────────
function drawAxes(ctx, W, H, xRange, yRange) {
  const toX = (x) => ((x - xRange[0]) / (xRange[1] - xRange[0])) * W;
  const toY = (y) => H - ((y - yRange[0]) / (yRange[1] - yRange[0])) * H;
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  const xStep = (xRange[1] - xRange[0]) / 10;
  const yStep = (yRange[1] - yRange[0]) / 8;
  for (let x = Math.ceil(xRange[0] / xStep) * xStep; x <= xRange[1]; x += xStep) {
    ctx.beginPath(); ctx.moveTo(toX(x), 0); ctx.lineTo(toX(x), H); ctx.stroke();
  }
  for (let y = Math.ceil(yRange[0] / yStep) * yStep; y <= yRange[1]; y += yStep) {
    ctx.beginPath(); ctx.moveTo(0, toY(y)); ctx.lineTo(W, toY(y)); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1.5;
  if (xRange[0] <= 0 && xRange[1] >= 0) { ctx.beginPath(); ctx.moveTo(toX(0), 0); ctx.lineTo(toX(0), H); ctx.stroke(); }
  if (yRange[0] <= 0 && yRange[1] >= 0) { ctx.beginPath(); ctx.moveTo(0, toY(0)); ctx.lineTo(W, toY(0)); ctx.stroke(); }
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.font = "9px JetBrains Mono, monospace";
  const xTicks = [-8, -6, -4, -2, 2, 4, 6, 8];
  xTicks.forEach(x => {
    if (x >= xRange[0] && x <= xRange[1]) {
      const px = toX(x);
      ctx.fillText(x, px - 5, toY(0) > H - 14 ? H - 4 : toY(0) < 14 ? 12 : toY(0) + 12);
    }
  });
  return { toX, toY };
}

function renderGraph(canvas, graphDef, params) {
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0d1318";
  ctx.fillRect(0, 0, W, H);

  const id = graphDef.id;

  if (id === "scatter") {
    const { noise = 1.5, slope = 1, n = 15 } = params;
    const pts = [];
    const seed = Math.round(noise * 100 + slope * 100 + n * 10);
    const rng = (s) => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
    for (let i = 0; i < Math.round(n); i++) {
      pts.push({ x: rng(seed + i * 3) * 10 - 0.5, y: rng(seed + i * 7) * noise * 2 - noise + slope * (rng(seed + i * 3) * 10 - 0.5) * 0.5 });
    }
    const { toX, toY } = drawAxes(ctx, W, H, [-1, 11], [-8, 8]);
    const avgX = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const avgY = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    const m2 = pts.reduce((s, p) => s + (p.x - avgX) * (p.y - avgY), 0) / pts.reduce((s, p) => s + (p.x - avgX) ** 2, 0);
    const b2 = avgY - m2 * avgX;
    ctx.strokeStyle = graphDef.color + "88";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 3]);
    ctx.beginPath();
    ctx.moveTo(toX(-1), toY(m2 * -1 + b2));
    ctx.lineTo(toX(11), toY(m2 * 11 + b2));
    ctx.stroke();
    ctx.setLineDash([]);
    pts.forEach(p => {
      ctx.fillStyle = graphDef.color;
      ctx.beginPath();
      ctx.arc(toX(p.x), toY(p.y), 4, 0, Math.PI * 2);
      ctx.fill();
    });
    return;
  }

  if (id === "histogram") {
    const { bins = 6, skew = 0, spread = 2 } = params;
    const numBins = Math.round(bins);
    const heights = [];
    for (let i = 0; i < numBins; i++) {
      const pos = (i - numBins / 2) / (numBins / 4);
      heights.push(Math.max(0.1, Math.exp(-0.5 * ((pos - skew * 0.5) / (spread * 0.4)) ** 2)));
    }
    const maxH = Math.max(...heights);
    const { toX, toY } = drawAxes(ctx, W, H, [-0.5, numBins + 0.5], [0, maxH * 1.3]);
    heights.forEach((h, i) => {
      const grad = ctx.createLinearGradient(0, toY(h), 0, toY(0));
      grad.addColorStop(0, graphDef.color);
      grad.addColorStop(1, graphDef.color + "33");
      ctx.fillStyle = grad;
      ctx.fillRect(toX(i + 0.05), toY(h), toX(i + 0.95) - toX(i + 0.05), toY(0) - toY(h));
      ctx.strokeStyle = graphDef.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(toX(i + 0.05), toY(h), toX(i + 0.95) - toX(i + 0.05), toY(0) - toY(h));
    });
    return;
  }

  if (id === "bargraph") {
    const { scale = 1, groups = 5 } = params;
    const numG = Math.round(groups);
    const seed = numG * 7;
    const rng = (s) => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
    const vals = Array.from({ length: numG }, (_, i) => (rng(seed + i * 13) * 4 + 1) * scale);
    const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].slice(0, numG);
    const maxV = Math.max(...vals);
    const { toX, toY } = drawAxes(ctx, W, H, [-0.5, numG + 0.5], [0, maxV * 1.3]);
    const colors = ["#00d4ff", "#7c3aed", "#10b981", "#f59e0b", "#ef4444", "#ec4899", "#06b6d4"];
    vals.forEach((v, i) => {
      const grad = ctx.createLinearGradient(0, toY(v), 0, toY(0));
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(1, colors[i % colors.length] + "33");
      ctx.fillStyle = grad;
      ctx.fillRect(toX(i + 0.1), toY(v), toX(i + 0.9) - toX(i + 0.1), toY(0) - toY(v));
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "9px JetBrains Mono, monospace";
      ctx.textAlign = "center";
      ctx.fillText(labels[i], toX(i + 0.5), toY(0) + 12);
    });
    ctx.textAlign = "left";
    return;
  }

  if (id === "piechart") {
    const { scale = 1 } = params;
    const data = [
      { label: "Housing", val: 35, color: "#00d4ff" },
      { label: "Food", val: 20, color: "#7c3aed" },
      { label: "Transport", val: 15, color: "#10b981" },
      { label: "Savings", val: 20, color: "#f59e0b" },
      { label: "Other", val: 10, color: "#ef4444" },
    ];
    const cx = W / 2, cy = H / 2 - 10;
    const r = Math.min(W, H) * 0.35 * scale;
    let angle = -Math.PI / 2;
    data.forEach(d => {
      const slice = (d.val / 100) * 2 * Math.PI;
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + slice);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#0d1318";
      ctx.lineWidth = 2;
      ctx.stroke();
      const midAngle = angle + slice / 2;
      const lx = cx + (r * 0.65) * Math.cos(midAngle);
      const ly = cy + (r * 0.65) * Math.sin(midAngle);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 10px DM Sans, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${d.val}%`, lx, ly);
      angle += slice;
    });
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "11px DM Sans, sans-serif";
    data.forEach((d, i) => {
      ctx.fillStyle = d.color;
      ctx.fillRect(12, H - 90 + i * 16, 10, 10);
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fillText(d.label, 26, H - 82 + i * 16);
    });
    return;
  }

  if (id === "probability") {
    const { mu = 0, sigma = 1 } = params;
    const { toX, toY } = drawAxes(ctx, W, H, [mu - 4 * sigma, mu + 4 * sigma], [0, 0.45 / sigma]);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, graphDef.color + "aa");
    grad.addColorStop(1, graphDef.color + "11");
    ctx.fillStyle = grad;
    ctx.beginPath();
    const step = (8 * sigma) / W;
    let first = true;
    for (let x = mu - 4 * sigma; x <= mu + 4 * sigma; x += step) {
      const y = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
      if (first) { ctx.moveTo(toX(x), toY(y)); first = false; }
      else ctx.lineTo(toX(x), toY(y));
    }
    ctx.lineTo(toX(mu + 4 * sigma), toY(0));
    ctx.lineTo(toX(mu - 4 * sigma), toY(0));
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = graphDef.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    first = true;
    for (let x = mu - 4 * sigma; x <= mu + 4 * sigma; x += step) {
      const y = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
      if (first) { ctx.moveTo(toX(x), toY(y)); first = false; }
      else ctx.lineTo(toX(x), toY(y));
    }
    ctx.stroke();
    return;
  }

  if (id === "realworld") {
    const { P = 1000, r = 0.07, n = 12, t = 20 } = params;
    const nC = Math.round(n);
    const { toX, toY } = drawAxes(ctx, W, H, [0, t + 1], [0, P * Math.pow(1 + r / nC, nC * t) * 1.15]);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, graphDef.color + "88");
    grad.addColorStop(1, graphDef.color + "11");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(P));
    for (let yr = 0; yr <= t; yr += t / 200) {
      ctx.lineTo(toX(yr), toY(P * Math.pow(1 + r / nC, nC * yr)));
    }
    ctx.lineTo(toX(t), toY(0));
    ctx.lineTo(toX(0), toY(0));
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = graphDef.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let yr = 0; yr <= t; yr += t / 200) {
      const val = P * Math.pow(1 + r / nC, nC * yr);
      if (yr === 0) ctx.moveTo(toX(yr), toY(val));
      else ctx.lineTo(toX(yr), toY(val));
    }
    ctx.stroke();
    // Simple (no compound) line
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(P));
    ctx.lineTo(toX(t), toY(P + P * r * t));
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }

  // Generic function plotter
  const xRange = [-10, 10];
  const { toX, toY } = drawAxes(ctx, W, H, xRange, [-8, 8]);

  if (id === "inequality") {
    const { m = 1, b = 2 } = params;
    const yTop = 8, yBot = -8;
    ctx.fillStyle = graphDef.color + "22";
    ctx.beginPath();
    ctx.moveTo(toX(-10), toY(m * -10 + b));
    ctx.lineTo(toX(10), toY(m * 10 + b));
    ctx.lineTo(toX(10), toY(yBot));
    ctx.lineTo(toX(-10), toY(yBot));
    ctx.closePath();
    ctx.fill();
  }

  const fn = (x) => {
    const { m = 1.5, b: bv = 2, a = 1, c = 0, d = 0, e = 0,
      h = 0, k = 0, A = 2, B = 1, C = 0, D = 0,
      m1 = 2, b1 = -1, m2 = -1, b2 = 5, split = 1, useCos = 0 } = params;
    switch (id) {
      case "linear": return m * x + bv;
      case "quadratic": return a * x * x + bv * x + c;
      case "cubic": return a * x ** 3 + bv * x ** 2 + c * x + d;
      case "polynomial": return a * x ** 4 + bv * x ** 3 + c * x ** 2 + d * x + e;
      case "exponential": return a * Math.pow(bv > 0 ? bv : 0.01, x - h) + k;
      case "logarithmic": return x - h > 0 ? a * Math.log(x - h) / Math.log(bv > 1 ? bv : 1.01) + k : null;
      case "absolute": return a * Math.abs(x - h) + k;
      case "rational": {
        const den = c * x + d;
        return Math.abs(den) < 0.01 ? null : (a * x + bv) / den;
      }
      case "piecewise": return x < split ? m1 * x + b1 : m2 * x + b2;
      case "sine": return A * (useCos >= 0.5 ? Math.cos(B * x + C) : Math.sin(B * x + C)) + D;
      case "tangent": {
        const tv = A * Math.tan(B * x + C) + D;
        return Math.abs(tv) > 20 ? null : tv;
      }
      case "inequality": return m * x + bv;
      default: return null;
    }
  };

  ctx.strokeStyle = graphDef.color;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = graphDef.color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  let penDown = false;
  const steps = 600;
  for (let i = 0; i <= steps; i++) {
    const x = xRange[0] + (i / steps) * (xRange[1] - xRange[0]);
    const y = fn(x);
    if (y === null || y === undefined || !isFinite(y) || Math.abs(y) > 80) {
      penDown = false; continue;
    }
    const px = toX(x), py = toY(y);
    if (!penDown) { ctx.moveTo(px, py); penDown = true; }
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ─── MINI PREVIEW CANVAS ──────────────────────────────────────────────────────
function MiniCanvas({ graphDef }) {
  const canvasRef = useRef(null);
  const defaults = useMemo(() => {
    const p = {};
    (graphDef.params || []).forEach(pr => { p[pr.key] = pr.default; });
    return p;
  }, [graphDef]);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.width = canvas.offsetWidth * window.devicePixelRatio || 340;
    canvas.height = 130 * window.devicePixelRatio;
    ctx_scale(canvas);
    renderGraph(canvas, graphDef, defaults);
  }, [graphDef, defaults]);
  function ctx_scale(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    canvas.style.width = (canvas.width / dpr) + "px";
    canvas.style.height = (canvas.height / dpr) + "px";
  }
  return <canvas ref={canvasRef} style={{ width: "100%", height: "130px" }} />;
}

// ─── MAIN CANVAS ──────────────────────────────────────────────────────────────
function MainCanvas({ graphDef, params }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = 420 * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    canvas.style.height = "420px";
    renderGraph(canvas, graphDef, params);
  }, [graphDef, params]);
  return <canvas ref={canvasRef} style={{ width: "100%", height: "420px" }} />;
}

// ─── CONTROL PANEL ────────────────────────────────────────────────────────────
function ControlPanel({ graphDef, params, onChange }) {
  if (!graphDef.params || graphDef.params.length === 0) return null;
  return (
    <div className="controls-row">
      {graphDef.params.map(p => (
        <div className="control-item" key={p.key}>
          <div className="control-label">{p.label}</div>
          <div className="control-inner">
            <input
              type="range" className="control-slider"
              min={p.min} max={p.max} step={p.step}
              value={params[p.key] ?? p.default}
              onChange={e => onChange(p.key, parseFloat(e.target.value))}
            />
            <input
              type="number" className="control-num"
              min={p.min} max={p.max} step={p.step}
              value={(params[p.key] ?? p.default).toFixed ? (params[p.key] ?? p.default).toFixed(p.step < 0.1 ? 3 : p.step < 1 ? 2 : 1) : params[p.key] ?? p.default}
              onChange={e => {
                const v = parseFloat(e.target.value);
                if (!isNaN(v)) onChange(p.key, Math.min(p.max, Math.max(p.min, v)));
              }}
            />
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── INFO PANEL ───────────────────────────────────────────────────────────────
function InfoPanel({ graphDef, params }) {
  const props = graphDef.props ? graphDef.props(params) : [];
  return (
    <div className="info-panel">
      <div className="info-section">
        <div className="info-label">Formula</div>
        <div className="formula-box">{graphDef.formula}</div>
      </div>
      <div className="info-section">
        <div className="info-label">About</div>
        <div className="info-text">{graphDef.desc}</div>
      </div>
      <div className="info-section">
        <div className="info-label">Key Properties</div>
        <div className="prop-list">
          {props.map((pr, i) => (
            <div className="prop-item" key={i}>
              <span className="prop-key">{pr.k}</span>
              <span className="prop-val">{pr.v}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── AI BAR ───────────────────────────────────────────────────────────────────
function AIBar({ graphDef, params, onParamsChange }) {
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [response, setResponse] = useState(null);
  const [defaultLoaded, setDefaultLoaded] = useState(false);

  useEffect(() => {
    if (!defaultLoaded && graphDef.defaultProblem) {
      setDefaultLoaded(true);
      callAI(graphDef.defaultProblem, graphDef, params);
    }
  }, [graphDef.id]);

  async function callAI(prompt, gDef, gParams) {
    setLoading(true);
    setResponse(null);
    try {
      const propsText = gDef.props ? gDef.props(gParams).map(p => `${p.k}: ${p.v}`).join(", ") : "";
      const systemPrompt = `You are a brilliant math tutor who explains things like a real human teacher — clear, practical, and never robotic. You are helping students understand graph functions through real-world scenarios.

Current graph: ${gDef.title} (${gDef.formula})
Current parameters: ${JSON.stringify(gParams)}
Key properties: ${propsText}

When given a word problem:
1. Identify the real-world context
2. Map it to the current mathematical function
3. Solve step by step with clear reasoning
4. Connect the answer back to the graph visually
5. Give a practical interpretation

Write naturally. Be specific with numbers. Avoid saying "AI-Generated" anywhere. Keep it under 200 words. Format with line breaks for readability. Do NOT use markdown headers or bullet symbols.`;

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const data = await res.json();
      const text = data.content?.map(c => c.text || "").join("") || "Could not generate a response.";
      setResponse(text);
    } catch {
      setResponse("Unable to connect to AI. Check your connection and try again.");
    }
    setLoading(false);
  }

  const handleSubmit = () => {
    const q = input.trim() || graphDef.defaultProblem;
    if (q) callAI(q, graphDef, params);
  };

  return (
    <div>
      <div className="ai-bar">
        <input
          className="ai-input"
          placeholder="Enter word problem / prompt"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && handleSubmit()}
        />
        <button className="ai-btn" onClick={handleSubmit} disabled={loading}>
          {loading ? <div className="spinner" /> : "Solve"}
        </button>
      </div>
      {loading && (
        <div className="ai-loading">
          <div className="spinner" /> Analyzing the problem...
        </div>
      )}
      {response && !loading && (
        <div className="ai-response">
          <div className="ai-response-title">Solution</div>
          {response.split("\n").map((line, i) => line.trim() ? <p key={i} style={{ marginBottom: "6px" }}>{line}</p> : <br key={i} />)}
        </div>
      )}
    </div>
  );
}

// ─── GRAPH CARD ───────────────────────────────────────────────────────────────
function GraphCard({ graphDef, isOpen, onToggle }) {
  const defaultParams = useMemo(() => {
    const p = {};
    (graphDef.params || []).forEach(pr => { p[pr.key] = pr.default; });
    return p;
  }, [graphDef]);
  const [params, setParams] = useState(defaultParams);

  const handleChange = useCallback((key, val) => {
    setParams(prev => ({ ...prev, [key]: val }));
  }, []);

  return (
    <div className={`graph-card ${isOpen ? "open" : ""}`} onClick={!isOpen ? onToggle : undefined}>
      <div className="card-header">
        <div className="card-meta">
          <div className="card-icon" style={{ background: graphDef.colorBg, color: graphDef.color }}>
            {graphDef.icon}
          </div>
          <div>
            <div className="card-title">{graphDef.title}</div>
            <div className="card-level">{graphDef.category} · {graphDef.level}</div>
          </div>
        </div>
        <button className="card-expand" onClick={e => { e.stopPropagation(); onToggle(); }}>
          {isOpen ? "×" : "+"}
        </button>
      </div>

      {!isOpen && (
        <div className="card-preview">
          <MiniCanvas graphDef={graphDef} />
        </div>
      )}

      {isOpen && (
        <div className="full-graph-view">
          <AIBar graphDef={graphDef} params={params} onParamsChange={handleChange} />
          <div className="graph-workspace">
            <div>
              <div className="canvas-container">
                <MainCanvas graphDef={graphDef} params={params} />
                <ControlPanel graphDef={graphDef} params={params} onChange={handleChange} />
              </div>
            </div>
            <InfoPanel graphDef={graphDef} params={params} />
          </div>
        </div>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function VisMath() {

  const filtered = useMemo(() =>
    GRAPH_DEFS.filter(g =>
      (category === "All" || g.category === category) &&
      (search === "" || g.title.toLowerCase().includes(search.toLowerCase()) || g.category.toLowerCase().includes(search.toLowerCase()))
    ),
    [category, search]
  );

  const handleExplore = () => {
    mainRef.current?.scrollIntoView({ behavior: "smooth" });
  };

  const toggle = (id) => setOpenId(prev => prev === id ? null : id);

  return (
    <>
      <style>{STYLES}</style>
      <div className="app">
        <nav className="nav">
          <div className="nav-logo">Vis<span>Math</span></div>
        </nav>

        <Hero onExplore={handleExplore} />

        <main className="main-section" ref={mainRef}>

            <div className="section-label">Graph Library</div>
            <h2 className="section-title">Explore Interactive Simulations</h2>
          </div>

          <div className="search-bar">
            <input
              className="search-input"
              placeholder="Search graphs by name or category..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />

          <div className="category-bar">
            {CATEGORIES.map(cat => (
              <button

                className={`cat-tab ${category === cat ? "active" : ""}`}

              <GraphCard

              />

          </div>
        </main>

        <footer className="footer">

    </>
  );
}
